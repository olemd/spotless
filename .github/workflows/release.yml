name: Release APK

# Push a tag like v1.2.3 (or v1.2.3-rc1) to build, test and publish spotless-<version>.apk
# on the matching GitHub Release. Running it manually with a version does the same and creates
# the tag on the commit it ran on; without a version it only builds a workflow artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.2.3 or 1.2.3-rc1 (empty: build only, no release)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Derive version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tag=""
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "$VERSION_INPUT" ]]; then
            tag="v${VERSION_INPUT#v}"
            if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
              echo "::error::Releases are only made from $DEFAULT_BRANCH, not $GITHUB_REF_NAME"; exit 1
            fi
            # Never move an existing tag: that would rewrite a published release.
            if [[ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]]; then
              echo "::error::Tag $tag already exists"; exit 1
            fi
          fi
          if [[ -n "$tag" ]]; then
            name="${tag#v}"
            if [[ ! "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-.+)?$ ]]; then
              echo "::error::'$tag' is not vMAJOR.MINOR.PATCH[-suffix]"; exit 1
            fi
            # MAJOR*10000 + MINOR*100 + PATCH, so minor/patch must stay below 100.
            code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
            prerelease=$([[ -n "${BASH_REMATCH[4]}" ]] && echo true || echo false)
          else
            name="0.0.0-dev.${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}"
            code=1
            prerelease=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "tag=${tag:-none} versionName=$name versionCode=$code prerelease=$prerelease"

      # Optional: without these secrets the APK is signed with a throwaway debug key, which
      # differs per build, so users must uninstall before every update.
      - name: Set up release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SPOTLESS_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::SPOTLESS_KEYSTORE_BASE64 not set, signing with debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SPOTLESS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          SPOTLESS_KEYSTORE_PASSWORD: ${{ secrets.SPOTLESS_KEYSTORE_PASSWORD }}
          SPOTLESS_KEY_ALIAS: ${{ secrets.SPOTLESS_KEY_ALIAS }}
          SPOTLESS_KEY_PASSWORD: ${{ secrets.SPOTLESS_KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          -PversionName="${{ steps.version.outputs.name }}"
          -PversionCode="${{ steps.version.outputs.code }}"

      - name: Collect APK
        id: apk
        run: |
          apk="spotless-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "file=$apk" >> "$GITHUB_OUTPUT"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}*

      - name: Publish to GitHub Release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # Reuse a release created by hand in the UI, otherwise create one with generated notes.
          # A manual run creates the tag on the commit it built (tags made with GITHUB_TOKEN
          # don't trigger another run).
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=(--generate-notes)
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then flags+=(--verify-tag); else flags+=(--target "$GITHUB_SHA"); fi
            [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
            gh release create "$TAG" "${flags[@]}"
          fi
          gh release upload "$TAG" --clobber "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256"
