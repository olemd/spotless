name: Release APK

# Push a tag like v1.2.3 (or v1.2.3-rc1) to build, test and publish spotless-<version>.apk
# on the matching GitHub Release. Run manually to just build and get the APK as a workflow artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Derive version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            name="${GITHUB_REF_NAME#v}"
            if [[ ! "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-.+)?$ ]]; then
              echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH[-suffix]"; exit 1
            fi
            # MAJOR*10000 + MINOR*100 + PATCH, so minor/patch must stay below 100.
            code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
            prerelease=$([[ -n "${BASH_REMATCH[4]}" ]] && echo true || echo false)
          else
            name="0.0.0-dev.${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}"
            code=1
            prerelease=true
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "versionName=$name versionCode=$code prerelease=$prerelease"

      # Optional: without these secrets the APK is signed with a throwaway debug key, which
      # differs per build, so users must uninstall before every update.
      - name: Set up release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SPOTLESS_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::SPOTLESS_KEYSTORE_BASE64 not set, signing with debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SPOTLESS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          SPOTLESS_KEYSTORE_PASSWORD: ${{ secrets.SPOTLESS_KEYSTORE_PASSWORD }}
          SPOTLESS_KEY_ALIAS: ${{ secrets.SPOTLESS_KEY_ALIAS }}
          SPOTLESS_KEY_PASSWORD: ${{ secrets.SPOTLESS_KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          -PversionName="${{ steps.version.outputs.name }}"
          -PversionCode="${{ steps.version.outputs.code }}"

      - name: Collect APK
        id: apk
        run: |
          apk="spotless-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "file=$apk" >> "$GITHUB_OUTPUT"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}*

      - name: Publish to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # Reuse a release created by hand in the UI, otherwise create one with generated notes.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=(--generate-notes --verify-tag)
            [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
            gh release create "$TAG" "${flags[@]}"
          fi
          gh release upload "$TAG" --clobber "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256"
